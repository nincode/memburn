set timeout=5
set default=0
search --no-floppy --set=root --file /EFI/memburn/@VERSION@/vmlinuz
# memburn.cfg lines are key=value, which GRUB reads as variable assignments; early_memtest=N sets memtest=N.
set early_memtest=2
if [ -f /memburn.cfg ]; then source /memburn.cfg; fi
set memtest=2
regexp --set=1:memtest '^([0-9]+)' "$early_memtest"
export memtest

# The stick's update keeps the block between these markers as the previous version's entries.
#BEGIN memburn @VERSION@
menuentry "memburn @VERSION@                (works with Secure Boot on)" {
    echo "memburn @VERSION@: loading"
    if [ "$memtest" != 0 ]; then
        echo "Kernel memory test: $memtest patterns, about 3 s per pattern per 16 GiB (early_memtest=0 turns it off)"
    fi
    linux /EFI/memburn/@VERSION@/vmlinuz quiet loglevel=1 consoleblank=0 vt.global_cursor_default=0 panic=30 oops=panic efi_pstore.pstore_disable=0 memtest=$memtest
    initrd /EFI/memburn/@VERSION@/initrd.img
}
menuentry "memburn @VERSION@ bare-metal UEFI (Secure Boot must be off; tests nearly all RAM)" {
    chainloader /EFI/memburn/@VERSION@/memburn.efi
}
#END
#PREVIOUS
menuentry "UEFI firmware settings" {
    fwsetup
}
