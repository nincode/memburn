[package]
name = "memburn"
version.workspace = true
license.workspace = true
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
qrcodegen = "1.8"
memburn-core = { path = "../core" }
memburn-proto = { path = "../proto" }
serde_json = "1"
crossterm = "0.29"
ureq = { version = "3", features = ["json"] }
sha2 = { version = "0.10", default-features = false }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory", "Win32_System_Threading", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Console"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[target."cfg(target_os = \"linux\")".dependencies]
memburn-gfx = { path = "../gfx" }

[target."cfg(target_os = \"linux\")".dev-dependencies]
memburn-gfx = { path = "../gfx", features = ["fixtures"] }

[dev-dependencies]
tiny-skia = "0.11"
fontdue = "0.9"
