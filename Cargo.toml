[workspace]
resolver = "3"
members = ["core", "cli", "uefi", "linux-init", "proto"]
default-members = ["core", "cli"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
opt-level = 1
